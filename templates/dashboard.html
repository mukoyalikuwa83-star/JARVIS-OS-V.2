<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d1117; color: #e6edf3; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #30363d; margin-bottom: 20px; }
        h1 { font-size: 1.8rem; color: #58a6ff; }
        .status-badge { padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; }
        .status-safe { background: #238636; color: #fff; }
        .status-warning { background: #d29922; color: #0d1117; }
        .status-danger { background: #da3633; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
        .card h2 { color: #58a6ff; margin-bottom: 15px; font-size: 1.1rem; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .kill-panel { grid-column: 1 / -1; }
        .kill-item { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .kill-item.danger { border-left: 4px solid #da3633; }
        .kill-item.warning { border-left: 4px solid #d29922; }
        .kill-info { flex: 1; }
        .kill-layer { font-weight: 600; color: #58a6ff; }
        .kill-reason { color: #8b949e; font-size: 0.9rem; }
        .kill-domain { color: #d29922; font-family: monospace; }
        .kill-time { color: #8b949e; font-size: 0.8rem; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
        .btn-danger { background: #da3633; color: white; }
        .btn-danger:hover { background: #f85149; }
        .btn-primary { background: #238636; color: white; }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
        .btn-secondary:hover { background: #30363d; }
        .circuit-breaker { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; margin-bottom: 8px; }
        .cb-name { font-weight: 500; }
        .cb-limit { color: #8b949e; font-size: 0.85rem; }
        .cb-status { padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .cb-ok { background: #238636; color: white; }
        .cb-triggered { background: #da3633; color: white; }
        .progress-bar { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; margin-top: 5px; width: 100%; }
        .progress-fill { height: 100%; background: #238636; transition: width 0.3s; }
        .progress-fill.warning { background: #d29922; }
        .progress-fill.danger { background: #da3633; }
        .audit-entry { padding: 10px; border-bottom: 1px solid #21262d; font-size: 0.85rem; }
        .audit-entry:last-child { border-bottom: none; }
        .audit-time { color: #8b949e; font-size: 0.75rem; }
        .audit-domain { color: #58a6ff; font-weight: 500; }
        .audit-action { color: #e6edf3; }
        .audit-result.success { color: #238636; }
        .audit-result.failed { color: #da3633; }
        .audit-result.pending { color: #d29922; }
        .tabs { display: flex; border-bottom: 1px solid #30363d; margin-bottom: 15px; }
        .tab { padding: 10px 20px; cursor: pointer; color: #8b949e; border-bottom: 2px solid transparent; }
        .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #21262d; }
        .stat-label { color: #8b949e; }
        .stat-value { font-weight: 600; color: #e6edf3; }
        .loading { text-align: center; color: #8b949e; padding: 40px; }
        .empty { text-align: center; color: #8b949e; padding: 40px; }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ JARVIS Dashboard</h1>
            <span id="system-status" class="status-badge status-safe">SYSTEM SAFE</span>
        </header>

        <div class="grid">
            <div class="card kill-panel">
                <h2>🛑 Kill Switch Status</h2>
                <div id="kill-panel">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="card">
                <h2>📊 Circuit Breakers</h2>
                <div id="circuit-breakers">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="card">
                <h2>💓 Heartbeats</h2>
                <div id="heartbeats">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="card">
                <h2>🔐 Credentials</h2>
                <div id="credentials">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="card">
                <h2>📋 Audit Log Stats</h2>
                <div id="audit-stats">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📜 Audit Log</h2>
            <div class="tabs">
                <div class="tab active" data-tab="recent">Recent</div>
                <div class="tab" data-tab="search">Search</div>
                <div class="tab" data-tab="stats">Stats</div>
            </div>
            <div id="tab-recent" class="tab-content active">
                <div id="audit-recent">
                    <div class="loading">Loading...</div>
                </div>
            </div>
            <div id="tab-search" class="tab-content">
                <input type="text" id="search-input" placeholder="Search audit log..." style="width: 100%; padding: 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; margin-bottom: 15px;">
                <div id="audit-search-results"></div>
            </div>
            <div id="tab-stats" class="tab-content">
                <div id="audit-stats-detail"></div>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>⚡ Quick Actions</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-danger" onclick="triggerKill('LOCAL_STOP', 'MANUAL_LOCAL', 'all', {})">🛑 Local Stop</button>
                <button class="btn btn-danger" onclick="triggerKill('REMOTE_STOP', 'MANUAL_REMOTE', 'all', {})">📱 Remote Stop</button>
                <button class="btn btn-secondary" onclick="refreshAll()">🔄 Refresh All</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}/ws`);
            ws.onopen = () => { console.log('WebSocket connected'); reconnectAttempts = 0; };
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'status') updateStatus(msg.data);
            };
            ws.onclose = () => {
                if (reconnectAttempts < 5) {
                    reconnectAttempts++;
                    setTimeout(connectWebSocket, 1000 * reconnectAttempts);
                }
            };
        }

        async function api(path, options = {}) {
            const res = await fetch('/api' + path, {
                method: options.method || 'GET',
                headers: { 'Content-Type': 'application/json', ...options.headers },
                body: options.body ? JSON.stringify(options.body) : undefined
            });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        function updateStatus(data) {
            const badge = document.getElementById('system-status');
            if (data.any_active) {
                badge.textContent = 'KILL ACTIVE';
                badge.className = 'status-badge status-danger';
            } else {
                badge.textContent = 'SYSTEM SAFE';
                badge.className = 'status-badge status-safe';
            }
            renderKillPanel(data.active_kills || []);
            renderCircuitBreakers(data.circuit_breakers || {});
            renderHeartbeats(data.heartbeats || {});
        }

        function renderKillPanel(kills) {
            const container = document.getElementById('kill-panel');
            if (kills.length === 0) {
                container.innerHTML = '<div class="empty">No active kill switches</div>';
                return;
            }
            container.innerHTML = kills.map((k, i) => `
                <div class="kill-item danger">
                    <div class="kill-info">
                        <div class="kill-layer">Layer ${k.layer}: ${k.reason}</div>
                        <div class="kill-reason">Domain: <span class="kill-domain">${k.domain}</span></div>
                        <div class="kill-time">${new Date(k.timestamp).toLocaleString()}</div>
                        <div class="kill-reason">Details: ${JSON.stringify(k.details || {})}</div>
                    </div>
                    <button class="btn btn-primary" onclick="acknowledgeKill(${i})" ${k.acknowledged ? 'disabled' : ''}>
                        ${k.acknowledged ? 'Acknowledged' : 'Acknowledge'}
                    </button>
                </div>
            `).join('');
        }

        function renderCircuitBreakers(breakers) {
            const container = document.getElementById('circuit-breakers');
            const entries = Object.entries(breakers);
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty">No circuit breakers configured</div>';
                return;
            }
            container.innerHTML = entries.map(([name, cb]) => {
                const pct = cb.limit > 0 ? Math.min(100, (cb.current / cb.limit) * 100) : 0;
                const statusClass = cb.triggered ? 'danger' : (pct > 80 ? 'warning' : 'ok');
                const statusText = cb.triggered ? 'TRIGGERED' : 'OK';
                return `
                    <div class="circuit-breaker">
                        <div>
                            <div class="cb-name">${name}</div>
                            <div class="cb-limit">Domain: ${cb.domain} | Limit: ${cb.limit} | Current: ${cb.current}</div>
                            <div class="progress-bar">
                                <div class="progress-fill ${pct > 80 ? 'warning' : (pct >= 100 ? 'danger' : '')}" style="width: ${pct}%"></div>
                            </div>
                        </div>
                        <div>
                            <span class="cb-status ${statusClass.toLowerCase()}">${statusText}</span>
                            ${cb.triggered ? `<button class="btn btn-secondary" style="margin-left: 10px; padding: 4px 10px; font-size: 0.75rem;" onclick="resetBreaker('${name}')">Reset</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderHeartbeats(heartbeats) {
            const container = document.getElementById('heartbeats');
            const entries = Object.entries(heartbeats);
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty">No heartbeats registered</div>';
                return;
            }
            container.innerHTML = entries.map(([domain, hb]) => `
                <div class="stat-row">
                    <span class="stat-label">${domain}</span>
                    <span class="stat-value">${hb.missed > 0 ? '⚠️ ' + hb.missed + ' missed' : '✅ OK'}</span>
                </div>
            `).join('');
        }

        async function loadCredentials() {
            try {
                const res = await api('/credentials');
                const container = document.getElementById('credentials');
                if (res.keys.length === 0) {
                    container.innerHTML = '<div class="empty">No credentials stored</div>';
                } else {
                    container.innerHTML = res.keys.map(k => `
                        <div class="stat-row">
                            <span class="stat-label">${k}</span>
                            <span class="stat-value">●●●●●●●●</span>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadAuditStats() {
            try {
                const stats = await api('/audit/stats');
                const container = document.getElementById('audit-stats');
                container.innerHTML = `
                    <div class="stat-row"><span class="stat-label">Total Entries</span><span class="stat-value">${stats.total_entries}</span></div>
                    <div class="stat-row"><span class="stat-label">By Domain</span><span class="stat-value">${Object.keys(stats.by_domain).length}</span></div>
                `;
                // Also load recent
                loadRecentAudit();
                loadAuditStatsDetail(stats);
            } catch (e) {
                console.error(e);
            }
        }

        async function loadRecentAudit() {
            try {
                const entries = await api('/audit/recent?limit=20');
                const container = document.getElementById('audit-recent');
                if (entries.length === 0) {
                    container.innerHTML = '<div class="empty">No audit entries yet</div>';
                    return;
                }
                container.innerHTML = entries.map(e => `
                    <div class="audit-entry">
                        <div class="audit-time">${new Date(e.timestamp_utc).toLocaleString()}</div>
                        <div><span class="audit-domain">${e.domain}</span> - <span class="audit-action">${e.action_proposed}</span></div>
                        <div class="audit-time">Screen: ${e.screening_result} | Gate: ${e.gate_result} | Exec: <span class="audit-result ${e.execution_result.includes('success') ? 'success' : e.execution_result.includes('failed') ? 'failed' : 'pending'}">${e.execution_result}</span></div>
                        <div class="audit-time">${e.reasoning_summary}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        async function loadAuditStatsDetail(stats) {
            const container = document.getElementById('audit-stats-detail');
            container.innerHTML = `
                <div class="stat-row"><span class="stat-label">Total Entries</span><span class="stat-value">${stats.total_entries}</span></div>
                <div class="stat-row"><span class="stat-label">By Domain</span><span class="stat-value">${JSON.stringify(stats.by_domain, null, 2)}</span></div>
                <div class="stat-row"><span class="stat-label">By Result</span><span class="stat-value">${JSON.stringify(stats.by_result, null, 2)}</span></div>
            `;
        }

        async function searchAudit() {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            try {
                const results = await api(`/audit/search?query=${encodeURIComponent(query)}&limit=50`);
                const container = document.getElementById('audit-search-results');
                if (results.length === 0) {
                    container.innerHTML = '<div class="empty">No results</div>';
                    return;
                }
                container.innerHTML = results.map(e => `
                    <div class="audit-entry">
                        <div class="audit-time">${new Date(e.timestamp_utc).toLocaleString()}</div>
                        <div><span class="audit-domain">${e.domain}</span> - <span class="audit-action">${e.action_proposed}</span></div>
                        <div class="audit-time">${e.reasoning_summary}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        function triggerKill(layer, reason, domain, details) {
            api('/kill', { method: 'POST', body: { layer, reason, domain, details } })
                .then(() => { refreshAll(); })
                .catch(e => alert('Error: ' + e.message));
        }

        function acknowledgeKill(index) {
            api('/kill/acknowledge', { method: 'POST', body: { kill_index: index } })
                .then(() => { refreshAll(); })
                .catch(e => alert('Error: ' + e.message));
        }

        function resetBreaker(name) {
            if (!confirm(`Reset circuit breaker ${name}?`)) return;
            api('/circuit-breaker/reset', { method: 'POST', body: { name, confirmed: true } })
                .then(() => { refreshAll(); })
                .catch(e => alert('Error: ' + e.message));
        }

        async function refreshAll() {
            try {
                const status = await api('/status');
                updateStatus(status);
                loadCredentials();
                loadAuditStats();
            } catch (e) {
                console.error(e);
            }
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });

        // Search input
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchAudit();
        });

        // Init
        connectWebSocket();
        refreshAll();
        setInterval(refreshAll, 30000); // Auto-refresh every 30s
    </script>
</body>
</html>
